name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Ingestion Engine
        run: npm run build --workspace=services/ingestion-engine

      - name: Build GraphQL API Gateway
        run: npm run build --workspace=services/api-gateway

      - name: Build Next.js Web UI
        run: npm run build --workspace=packages/web

      - name: Run Unit & Integration Tests
        run: npm test --workspaces --if-present

  docker-build:
    name: Build Docker Containers
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/api-gateway/Dockerfile
          push: false
          tags: codebase-kg/api-gateway:latest

      - name: Build Web UI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/web/Dockerfile
          push: false
          tags: codebase-kg/web:latest

  helm-lint:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.12.0

      - name: Lint Helm Chart
        run: helm lint infra/k8s/helm/codebase-kg
