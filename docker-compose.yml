services:
  # Neo4j Graph Database with APOC plugins enabled
  neo4j:
    image: neo4j:5.18.0-community
    container_name: codebase_kg_neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/codebase_kg_secret_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_apoc_export_file_enabled=true
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "neo4j-admin", "database", "info", "neo4j"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codebase_kg_net

  # Apollo GraphQL API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: codebase_kg_api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=codebase_kg_secret_password
      - NEO4J_DATABASE=neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - codebase_kg_net

  # Next.js Visual Knowledge Graph UI
  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: codebase_kg_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_GRAPHQL_ENDPOINT=http://localhost:4000/graphql
    depends_on:
      - api-gateway
    networks:
      - codebase_kg_net

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  codebase_kg_net:
    driver: bridge
