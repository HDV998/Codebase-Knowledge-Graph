apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    app: {{ .Release.Name }}-api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-api-gateway
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: "{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.apiGateway.service.port }}
              name: http
          env:
            - name: PORT
              value: "{{ .Values.apiGateway.env.PORT }}"
            - name: NEO4J_URI
              value: "{{ .Values.apiGateway.env.NEO4J_URI }}"
            - name: NEO4J_USER
              value: "{{ .Values.neo4j.auth.username }}"
            - name: NEO4J_PASSWORD
              value: "{{ .Values.neo4j.auth.password }}"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-api-gateway
  labels:
    app: {{ .Release.Name }}-api-gateway
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: http
      name: http
  selector:
    app: {{ .Release.Name }}-api-gateway
