{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  labels:
    app: {{ .Release.Name }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ if eq .service "web" }}{{ $.Release.Name }}-web{{ else }}{{ $.Release.Name }}-api-gateway{{ end }}
                port:
                  number: {{ if eq .service "web" }}{{ $.Values.web.service.port }}{{ else }}{{ $.Values.apiGateway.service.port }}{{ end }}
          {{- end }}
    {{- end }}
{{- end }}
