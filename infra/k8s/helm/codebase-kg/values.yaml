global:
  environment: production
  domain: codebase-kg.internal.corp

neo4j:
  replicaCount: 1
  image:
    repository: neo4j
    tag: 5.18.0-community
    pullPolicy: IfNotPresent
  service:
    boltPort: 7687
    httpPort: 7474
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi
  auth:
    username: neo4j
    password: codebase_kg_secret_password
  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 1Gi

apiGateway:
  replicaCount: 2
  image:
    repository: enterprise-registry.corp/codebase-kg/api-gateway
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    port: 4000
  env:
    PORT: 4000
    NEO4J_URI: "bolt://codebase-kg-neo4j:7687"
    NEO4J_DATABASE: "neo4j"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 256Mi

web:
  replicaCount: 2
  image:
    repository: enterprise-registry.corp/codebase-kg/web
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    port: 3000
  env:
    NEXT_PUBLIC_GRAPHQL_ENDPOINT: "http://api.codebase-kg.internal.corp/graphql"
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
  hosts:
    - host: codebase-kg.internal.corp
      paths:
        - path: /
          pathType: Prefix
          service: web
        - path: /graphql
          pathType: Prefix
          service: api-gateway
